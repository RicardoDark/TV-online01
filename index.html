<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IPTV Premium Player</title>
    <!-- Google Fonts for premium typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <script>try{if(localStorage.getItem('iptv_session'))document.documentElement.className+=' has-session';}catch(e){}</script>
    <link rel="stylesheet" href="style.css?v=16">
    <!-- Local HLS.js Library -->
    <script src="hls.min.js"></script>
</head>
<body>

    <!-- Fullscreen Video Player -->
    <video id="video-player" playsinline autoplay></video>

    <!-- Glassmorphic Overlay Menu -->
    <div id="overlay-menu" class="visible">
        <div class="menu-container">
            <!-- Left Side: Folders -->
            <div class="column folders-column">
                <div class="column-header">
                    <h2>Pastas</h2>
                </div>
                <div class="list-container" id="folders-list">
                    <!-- Folders will be injected here -->
                </div>
            </div>

            <!-- Right Side: Channels -->
            <div class="column channels-column">
                <div class="column-header">
                    <h2 id="current-folder-title">Canais</h2>
                </div>
                <div class="list-container" id="channels-list">
                    <!-- Channels will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tela de Login (primeira tela do app) -->
    <div id="login-screen" class="login-visible">
        <div class="login-box">
            <h1 class="login-title">Entrar</h1>
            <div class="login-sub">Acesse o seu servidor IPTV</div>

            <label class="login-label" for="login-user">Usuário</label>
            <input id="login-user" class="login-field" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" readonly>

            <label class="login-label" for="login-pass">Senha</label>
            <input id="login-pass" class="login-field" type="text" inputmode="none" autocomplete="off" autocapitalize="off" spellcheck="false" readonly>

            <label class="login-label">Servidor</label>
            <div id="login-link" class="login-field login-select" tabindex="0" role="button">
                <span class="ls-arrow">&#9664;</span>
                <span id="login-server-name" class="ls-name"></span>
                <span class="ls-arrow">&#9654;</span>
            </div>

            <label class="login-label" for="login-custom">Ou digite um link (opcional)</label>
            <input id="login-custom" class="login-field" type="text" inputmode="none" placeholder="http://meuservidor.com:8080" autocomplete="off" autocapitalize="off" spellcheck="false" readonly>

            <div id="login-error" class="login-error hidden"></div>

            <div id="btn-login" class="login-btn" tabindex="0">Entrar</div>
        </div>

        <div id="btn-free" class="login-free" tabindex="0">TV grátis</div>
    </div>

    <!-- Category Selection Splash Screen -->
    <div id="splash-screen">
        <!-- Vencimento da lista IPTV (canto superior esquerdo) -->
        <div id="splash-expiry" class="splash-expiry hidden">
            <div id="splash-expiry-main" class="splash-expiry-main"></div>
            <div id="splash-expiry-sub" class="splash-expiry-sub"></div>
        </div>

        <!-- Atalhos no canto: TV Favoritos, Favoritos (filmes e séries) e Histórico -->
        <div class="top-status-bar">
            <div id="btn-tvfav" class="status-icon-item status-pill" tabindex="0" title="TV Favoritos">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                    <polyline points="17 2 12 7 7 2"></polyline>
                </svg>
                <span>TV Favoritos</span>
            </div>
            <div id="btn-vodfav" class="status-icon-item status-pill" tabindex="0" title="Favoritos de Filmes e Séries">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
                </svg>
                <span>Filmes e Séries Favoritos</span>
            </div>
            <div id="btn-vodhist" class="status-icon-item" tabindex="0" title="Histórico">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
            </div>
            <div id="btn-logout" class="status-icon-item" tabindex="0" title="Sair da conta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </div>
        </div>

        <div class="splash-content-wrapper">
            <div class="splash-cards-container">
                <!-- TV Card -->
                <div id="btn-tv" class="splash-card tv-card focused" tabindex="0">
                    <div class="splash-card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
                            <polyline points="17 2 12 7 7 2"></polyline>
                        </svg>
                    </div>
                    <span class="splash-card-title">TV ao Vivo</span>
                </div>

                <!-- Movies Card -->
                <div id="btn-movies" class="splash-card movies-card" tabindex="0">
                    <div class="splash-card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 7l-6 5 6 5V7z"></path>
                            <rect x="2" y="6" width="14" height="12" rx="2" ry="2"></rect>
                        </svg>
                    </div>
                    <span class="splash-card-title">FILMES</span>
                </div>

                <!-- Series Card -->
                <div id="btn-series" class="splash-card series-card" tabindex="0">
                    <div class="splash-card-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <circle cx="12" cy="12" r="3"></circle>
                            <line x1="12" y1="2" x2="12" y2="9"></line>
                            <line x1="12" y1="15" x2="12" y2="22"></line>
                        </svg>
                    </div>
                    <span class="splash-card-title">SERIES</span>
                </div>
            </div>
        </div>

        <!-- Version Footer -->
        <div class="splash-version">v1.0.0</div>
    </div>

    <!-- Status & Loading Overlay -->
    <div id="status-container" class="hidden">
        <div class="spinner"></div>
        <div id="status-message">Carregando canais...</div>
    </div>

    <!-- Action Bar / Info (shown briefly when channel changes) -->
    <div id="toast-info" class="hidden">
        <div class="toast-channel-name" id="toast-channel-name">Nome do Canal</div>
        <div class="toast-channel-group" id="toast-channel-group">Grupo do Canal</div>
    </div>

    <div id="vod-msg" class="vod-msg hidden"></div>

    <div id="vod-backbtn" class="vod-backbtn">&#8592; Voltar</div>

    <!-- Filmes e Séries -->
    <div id="vod-root"></div>
    <div id="vod-spin" class="vod-spin hidden"><div class="spinner"></div></div>

    <!-- Player em tela cheia (Filmes e Séries) -->
    <div id="vod-player-ui">
        <div class="vod-pui-layer">
            <div class="vod-pui-cam">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 7l-6 5 6 5V7z"></path><rect x="2" y="6" width="14" height="12" rx="2" ry="2"></rect></svg>
            </div>
            <div class="vod-pui-touch">
                <div class="vod-tbtn" data-a="rew">-10</div>
                <div class="vod-tbtn" data-a="play">Play/Pause</div>
                <div class="vod-tbtn" data-a="ff">+10</div>
                <div class="vod-tbtn" data-a="set">Configurações</div>
                <div class="vod-tbtn" data-a="close">Sair</div>
            </div>
            <div class="vod-pui-bar">
                <img id="vod-pui-thumb" class="vod-pui-thumb" alt="">
                <div class="vod-pui-mid">
                    <div class="vod-pui-title" id="vod-pui-title"></div>
                    <div class="vod-pui-times"><span id="vod-pui-cur">00:00</span><span id="vod-pui-dur">00:00</span></div>
                    <div class="vod-pui-track" data-a="track"><div id="vod-pui-fill"></div></div>
                    <div class="vod-pui-hints">
                        <span class="vod-hint"><i>&#9664;&#9654;</i>Avançar/Voltar</span>
                        <span class="vod-hint"><i>&#9660;</i>Configurações</span>
                        <span class="vod-hint"><i>OK</i>Play/Pause</span>
                    </div>
                </div>
            </div>
            <div class="vod-settings hidden" id="vod-settings"></div>
        </div>
        <div class="vod-pui-center" id="vod-pui-center"></div>
    </div>

    <script src="app.js?v=20"></script>
</body>
</html>
